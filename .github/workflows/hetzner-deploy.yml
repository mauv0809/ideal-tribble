name: Build and Deploy to Hetzner

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  # ------------------------------------------------------------------------------------
  # REQUIRED GITHUB SECRETS
  # ------------------------------------------------------------------------------------
  # SERVER_IP: IP address of the Hetzner server (get from Spacelift after first run)
  # SSH_PRIVATE_KEY: Private SSH key for server access
  # ------------------------------------------------------------------------------------
  GO_VERSION: "1.21"
  BINARY_NAME: "ideal-tribble"

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run Tests
        run: go test -v -race ./...

  build:
    name: Build Application
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build Linux Binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ${{ env.BINARY_NAME }} .
          chmod +x ${{ env.BINARY_NAME }}

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}
          path: ${{ env.BINARY_NAME }}
          retention-days: 1

  # Note: Infrastructure is managed by Spacelift automatically
  # Spacelift will deploy infrastructure changes when code is pushed to main

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Deploy Application to Server
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Binary Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to Hetzner Server
        run: |
          SERVER_IP="${{ secrets.SERVER_IP }}"
          echo "Deploying to server: $SERVER_IP"
          
          # Make binary executable
          chmod +x ${{ env.BINARY_NAME }}
          
          # Copy files to server
          scp -o StrictHostKeyChecking=no ${{ env.BINARY_NAME }} root@$SERVER_IP:/opt/ideal-tribble/
          scp -o StrictHostKeyChecking=no -r scripts/ root@$SERVER_IP:/opt/ideal-tribble/
          scp -o StrictHostKeyChecking=no -r migrations/ root@$SERVER_IP:/opt/ideal-tribble/
          
          # Deploy and restart service using centralized script
          ssh -o StrictHostKeyChecking=no root@$SERVER_IP << 'EOF'
            set -e
            cd /opt/ideal-tribble
            ./scripts/deploy-server-setup.sh
          EOF

      - name: Health Check
        run: |
          SERVER_IP="${{ secrets.SERVER_IP }}"
          
          # Wait for service to fully start
          echo "Waiting for service to start..."
          sleep 15
          
          # Check health endpoint
          if curl -sf "http://$SERVER_IP:8080/health" > /dev/null; then
            echo "✅ Health check passed - Application is running"
          else
            echo "❌ Health check failed - Application may not be responding"
            # Still try to get some info
            ssh -o StrictHostKeyChecking=no root@$SERVER_IP "systemctl status ideal-tribble --no-pager || true"
            exit 1
          fi