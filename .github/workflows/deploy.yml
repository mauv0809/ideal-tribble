name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      command:
        description: "Kamal command to run"
        type: choice
        options: [deploy, setup, rollback]
        default: setup

# Default GITHUB_TOKEN scopes:
# - contents:read   to checkout
# - packages:write  to push the image to GHCR
permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Test
        run: go test ./...

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production

    env:
      # Kamal reads .kamal/secrets at deploy time and substitutes $VAR
      # references from this env block.
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      TURSO_PRIMARY_URL: ${{ secrets.TURSO_PRIMARY_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      TENANT_ID: ${{ secrets.TENANT_ID }}
      WEB_SESSION_SECRET: ${{ secrets.WEB_SESSION_SECRET }}
      WEB_TOTP_ENCRYPTION_KEY: ${{ secrets.WEB_TOTP_ENCRYPTION_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify required secrets are set
        # Fail fast before provisioning anything if a required secret is missing.
        env:
          KAMAL_SSH_PRIVATE_KEY: ${{ secrets.KAMAL_SSH_PRIVATE_KEY }}
          KAMAL_SSH_KNOWN_HOSTS: ${{ secrets.KAMAL_SSH_KNOWN_HOSTS }}
        run: |
          missing=()
          for var in \
              KAMAL_SSH_PRIVATE_KEY \
              KAMAL_SSH_KNOWN_HOSTS \
              TURSO_PRIMARY_URL \
              TURSO_AUTH_TOKEN \
              TENANT_ID \
              WEB_SESSION_SECRET \
              WEB_TOTP_ENCRYPTION_KEY; do
            if [ -z "${!var}" ]; then
              missing+=("$var")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub Secrets: ${missing[*]}"
            echo "Set them at Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "All required secrets present."

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Install Kamal
        run: gem install kamal -v "~> 2"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.KAMAL_SSH_PRIVATE_KEY }}

      - name: Pin deploy host's public keys
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KAMAL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
        env:
          KAMAL_SSH_KNOWN_HOSTS: ${{ secrets.KAMAL_SSH_KNOWN_HOSTS }}

      - name: Materialize Kamal secrets file
        run: |
          mkdir -p .kamal
          cp .kamal/secrets.example .kamal/secrets

      - name: Run Kamal
        # Default to `setup` (idempotent: on a configured host it's ~= deploy
        # plus a fast accessory-state check, so a fresh box also works).
        run: |
          CMD="${{ inputs.command || 'setup' }}"
          echo "Running: kamal $CMD"
          kamal "$CMD"
