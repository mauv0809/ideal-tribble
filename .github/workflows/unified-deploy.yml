name: Unified Infrastructure & Application Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  # ------------------------------------------------------------------------------------
  # REQUIRED GITHUB SECRETS
  # ------------------------------------------------------------------------------------
  # Infrastructure:
  # TF_API_TOKEN: Terraform Cloud API token
  # HCLOUD_TOKEN: Hetzner Cloud API token
  # SSH_PRIVATE_KEY: Private SSH key for server access
  # SSH_PUBLIC_KEY: Public SSH key for server access
  #
  # Application Environment Variables (Secrets):
  # DB_NAME: Database name
  # TURSO_PRIMARY_URL: Primary database URL (libsql://...)
  # TURSO_AUTH_TOKEN: Database auth token
  # SLACK_BOT_TOKEN: Slack bot token (xoxb-...)
  # SLACK_CHANNEL_ID: Slack channel ID
  # SLACK_SIGNING_SECRET: Slack signing secret
  # TENANT_ID: Playtomic tenant ID
  # OTEL_EXPORTER_OTLP_ENDPOINT: OpenTelemetry endpoint (e.g., localhost:4317)
  # GRAFANA_ADMIN_PASSWORD: Grafana admin password
  # WEB_SESSION_SECRET: Session cookie secret (32+ chars)
  # WEB_TOTP_ENCRYPTION_KEY: TOTP encryption key (exactly 32 chars for AES-256)
  # CLOUDFLARE_API_TOKEN: Cloudflare API token for DNS-01 SSL certificates (Zone:DNS:Edit)
  # ------------------------------------------------------------------------------------
  
  # Application Configuration (easily changeable)
  APP_ENV: "production"
  APP_VERSION: ${{ github.sha }}
  
  # Build Configuration
  GO_VERSION: "1.21"
  BINARY_NAME: "ideal-tribble"
  TF_VERSION: "1.6.0"

jobs:
  # Run tests first - fast feedback
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run Tests
        run: go test -v -race ./...

  # Deploy infrastructure (runs in parallel with build)
  terraform-apply:
    name: Deploy Infrastructure
    permissions:
      contents: read
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: terraform/hetzner
    outputs:
      server_ip: ${{ steps.tf-output.outputs.server_ip }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: |
          export TF_VAR_hcloud_token="${{ secrets.HCLOUD_TOKEN }}"
          export TF_VAR_ssh_public_key="${{ secrets.SSH_PUBLIC_KEY }}"
          terraform apply -auto-approve

      - name: Get Server IP
        id: tf-output
        run: |
          SERVER_IP=$(terraform output -raw server_ip)
          echo "server_ip=$SERVER_IP" >> $GITHUB_OUTPUT
          echo "Server IP: $SERVER_IP"

      - name: Wait for Server to be Ready
        run: |
          SERVER_IP=${{ steps.tf-output.outputs.server_ip }}
          echo "Waiting for server $SERVER_IP to be ready..."
          
          # Setup SSH key
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa_temp
          chmod 600 ~/.ssh/id_rsa_temp
          
          # Wait up to 5 minutes for SSH to be available
          timeout 300 bash -c "
            until ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa_temp root@$SERVER_IP 'echo SSH_READY'; do
              echo 'Waiting for SSH...'
              sleep 10
            done
          "
          
          # Clean up temporary key
          rm -f ~/.ssh/id_rsa_temp

  # Build application
  build:
    name: Build Application
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build Linux Binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ${{ env.BINARY_NAME }} .
          chmod +x ${{ env.BINARY_NAME }}

      - name: Upload Binary Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}
          path: ${{ env.BINARY_NAME }}
          retention-days: 1

  # Deploy application (waits for both build and infrastructure)
  deploy-application:
    name: Deploy Application
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [build, terraform-apply]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Binary
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}

      - name: Get Server IP
        id: server-ip
        run: |
          # Use IP from terraform output (terraform-apply always runs now)
          echo "server_ip=${{ needs.terraform-apply.outputs.server_ip }}" >> $GITHUB_OUTPUT

      - name: Setup SSH
        run: |
          SERVER_IP="${{ steps.server-ip.outputs.server_ip }}"
          if [ -z "$SERVER_IP" ]; then
            echo "Error: No server IP found"
            exit 1
          fi
          
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts
          
          # Ensure tribble user has SSH access by copying authorized_keys
          ssh -o StrictHostKeyChecking=no root@$SERVER_IP "mkdir -p /home/tribble/.ssh && cp /root/.ssh/authorized_keys /home/tribble/.ssh/ && chown -R tribble:tribble /home/tribble/.ssh && chmod 700 /home/tribble/.ssh && chmod 600 /home/tribble/.ssh/authorized_keys"

      - name: Create Environment File
        run: |
          cat > .env << EOF
          # Database
          DB_NAME=${{ secrets.DB_NAME }}
          TURSO_PRIMARY_URL=${{ secrets.TURSO_PRIMARY_URL }}
          TURSO_AUTH_TOKEN=${{ secrets.TURSO_AUTH_TOKEN }}

          # Slack
          SLACK_BOT_TOKEN=${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID=${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_SIGNING_SECRET=${{ secrets.SLACK_SIGNING_SECRET }}

          # Playtomic
          TENANT_ID=${{ secrets.TENANT_ID }}

          # Server
          PORT=8080

          # Web UI Authentication
          WEB_SESSION_SECRET=${{ secrets.WEB_SESSION_SECRET }}
          WEB_TOTP_ENCRYPTION_KEY=${{ secrets.WEB_TOTP_ENCRYPTION_KEY }}

          # OpenTelemetry
          OTEL_EXPORTER_OTLP_ENDPOINT=${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          APP_ENV=${{ env.APP_ENV }}
          APP_VERSION=${{ env.APP_VERSION }}

          # Observability
          GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          EOF

      - name: Validate Environment File
        run: |
          echo "Validating environment variables..."
          chmod +x scripts/validate-env.sh
          ./scripts/validate-env.sh .env

      - name: Deploy to Server
        run: |
          SERVER_IP="${{ steps.server-ip.outputs.server_ip }}"
          echo "Deploying to server: $SERVER_IP"
          
          # Verify binary exists and make it executable
          if [ ! -f "${{ env.BINARY_NAME }}" ]; then
            echo "❌ Binary file ${{ env.BINARY_NAME }} not found!"
            ls -la
            exit 1
          fi
          chmod +x ${{ env.BINARY_NAME }}
          
          # Stop service before copying new binary to avoid file-in-use error
          ssh -o StrictHostKeyChecking=no root@$SERVER_IP "systemctl stop ideal-tribble || true"

          # Setup Cloudflare credentials for certbot DNS-01 challenge
          ssh -o StrictHostKeyChecking=no root@$SERVER_IP << EOF
            mkdir -p /etc/letsencrypt
            cat > /etc/letsencrypt/cloudflare.ini << 'CFEOF'
          dns_cloudflare_api_token = ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CFEOF
            chmod 600 /etc/letsencrypt/cloudflare.ini
          EOF

          # Copy files to server as tribble user
          scp -o StrictHostKeyChecking=no ${{ env.BINARY_NAME }} tribble@$SERVER_IP:/opt/ideal-tribble/
          scp -o StrictHostKeyChecking=no .env tribble@$SERVER_IP:/opt/ideal-tribble/
          scp -o StrictHostKeyChecking=no -r scripts/ tribble@$SERVER_IP:/opt/ideal-tribble/ || true
          scp -o StrictHostKeyChecking=no -r migrations/ tribble@$SERVER_IP:/opt/ideal-tribble/ || true
          scp -o StrictHostKeyChecking=no -r observability/ tribble@$SERVER_IP:/opt/ideal-tribble/ || true
          
          # Fix script permissions and run deployment script
          ssh -o StrictHostKeyChecking=no root@$SERVER_IP << 'EOF'
            set -e
            cd /opt/ideal-tribble
            chmod +x scripts/*.sh
            ./scripts/deploy-server-setup.sh
          EOF

      - name: Health Check
        run: |
          SERVER_IP="${{ steps.server-ip.outputs.server_ip }}"
          
          echo "Waiting for service to start..."
          sleep 5
          
          # Check health endpoint through nginx proxy
          if curl -sf "https://wally-api.utiger.dk/health" > /dev/null; then
            echo "✅ Health check passed - Application is running"
          else
            echo "❌ Health check failed - Application may not be responding"
            ssh -o StrictHostKeyChecking=no root@$SERVER_IP "systemctl status ideal-tribble --no-pager || true"
            exit 1
          fi