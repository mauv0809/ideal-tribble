[server]
# External URL where Grafana is accessed (behind nginx reverse proxy)
root_url = https://wally-api.utiger.dk/grafana/
serve_from_sub_path = true

[security]
admin_user = admin
admin_password = ${GRAFANA_ADMIN_PASSWORD}

[users]
allow_sign_up = false
auto_assign_org = true
auto_assign_org_role = Viewer

[auth.anonymous]
enabled = false

[log]
mode = console
level = info

[analytics]
reporting_enabled = false
check_for_updates = false

[alerting]
enabled = false