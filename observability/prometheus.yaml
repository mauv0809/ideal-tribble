global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape the ideal-tribble app metrics
  - job_name: 'ideal-tribble'
    static_configs:
      - targets: ['host.docker.internal:8080']
    metrics_path: /metrics
    scrape_interval: 10s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
