services:
  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.94.0
    container_name: otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    depends_on:
      - tempo
      - loki
    networks:
      - observability
    deploy:
      resources:
        limits:
          memory: 128M

  # Grafana Tempo for distributed tracing
  tempo:
    image: grafana/tempo:2.3.1
    container_name: tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - /var/lib/observability/tempo:/var/tempo:rw
    ports:
      - "3200:3200"   # Tempo HTTP
      - "3201:3201"   # Tempo gRPC
    networks:
      - observability
    deploy:
      resources:
        limits:
          memory: 512M

  # Grafana Loki for log aggregation
  loki:
    image: grafana/loki:2.9.4
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki.yaml:/etc/loki/local-config.yaml:ro
      - /var/lib/observability/loki:/loki:rw
    ports:
      - "3100:3100"   # Loki HTTP
    networks:
      - observability
    deploy:
      resources:
        limits:
          memory: 256M

  # Grafana for visualization
  grafana:
    image: grafana/grafana:10.2.3
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - /var/lib/observability/grafana:/var/lib/grafana:rw
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana.ini:/etc/grafana/grafana.ini:ro
    ports:
      - "3000:3000"   # Grafana HTTP (internal only)
    depends_on:
      - tempo
      - loki
    networks:
      - observability
    deploy:
      resources:
        limits:
          memory: 256M

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - /var/lib/observability/prometheus:/prometheus:rw
    ports:
      - "9090:9090"   # Prometheus HTTP
    networks:
      - observability
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 256M

  # Promtail for log collection
  promtail:
    image: grafana/promtail:2.9.4
    container_name: promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail.yaml:/etc/promtail/config.yml:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    ports:
      - "9080:9080"   # Promtail HTTP (for health checks)
    depends_on:
      - loki
    networks:
      - observability
    deploy:
      resources:
        limits:
          memory: 64M

networks:
  observability:
    driver: bridge