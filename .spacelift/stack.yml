# Spacelift stack configuration for ideal-tribble Hetzner deployment
# This file defines how Spacelift should manage this Terraform stack

stack:
  name: "ideal-tribble-hetzner"
  description: "Hetzner VPS infrastructure for ideal-tribble Slack bot"
  
  # Terraform configuration
  terraform:
    version: "1.6.6"
    workspace: "default"
    
  # Working directory for Terraform
  project_root: "terraform/hetzner"
  
  # GitHub integration
  repository: "mauv0809/ideal-tribble"  # Update with your GitHub username/repo
  branch: "main"
  
  # Deployment settings
  autodeploy: true  # Auto-deploy on main branch pushes
  autoretry: false
  
  # Environment variables (configure in Spacelift UI)
  # - HCLOUD_TOKEN (Hetzner Cloud API token) - mark as secret
  # - SSH_PUBLIC_KEY (SSH public key for server access)
  
  # Policies (optional - can be configured later)
  policies:
    plan: []
    trigger: []
    push: []
    
  # Labels for organization
  labels:
    - "environment:production"
    - "service:ideal-tribble" 
    - "provider:hetzner"
    
  # Notifications (optional)
  webhooks: []