#cloud-config

# Basic server setup for ideal-tribble
package_update: true
package_upgrade: true

packages:
  - curl
  - wget
  - unzip
  - nginx
  - certbot
  - python3-certbot-nginx
  - ufw
  - htop
  - git

# Create application user
users:
  - name: ${APP_USER}
    system: true
    shell: /bin/bash
    home: ${APP_DIR}
    create_home: true

# Create directories
runcmd:
  # Setup firewall
  - ufw allow ssh
  - ufw allow 'Nginx Full' 
  - echo "y" | ufw enable
  
  # Create application directory
  - mkdir -p ${APP_DIR}
  - chown ${APP_USER}:${APP_USER} ${APP_DIR}
  
  # Setup nginx reverse proxy
  - |
    cat > /etc/nginx/sites-available/ideal-tribble << 'EOF'
    server {
        listen 80;
        server_name wally-api.utiger.dk;
        
        location / {
            proxy_pass http://localhost:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Health check endpoint
        location /health {
            proxy_pass http://localhost:8080/health;
            access_log off;
        }
    }
    EOF
  
  - ln -sf /etc/nginx/sites-available/ideal-tribble /etc/nginx/sites-enabled/
  - rm -f /etc/nginx/sites-enabled/default
  - nginx -t && systemctl reload nginx
  
  # Setup deployment directory
  - mkdir -p /opt/deployment
  - echo "Server setup complete. Ready for application deployment."

write_files:
  - path: /opt/deployment/README.md
    content: |
      # Ideal Tribble Server Setup Complete
      
      Next steps:
      1. Upload your application binary to ${APP_DIR}/ideal-tribble
      2. Run: chmod +x ${APP_DIR}/ideal-tribble  
      3. Run: ./scripts/setup-secrets.sh
      4. Run: ./scripts/install-systemd-service.sh
      5. Run: ./scripts/setup-cron.sh
      6. Run: sudo systemctl start ideal-tribble
      
      SSL Certificate:
      - sudo certbot --nginx -d wally-api.utiger.dk
      
      Logs:
      - sudo journalctl -u ideal-tribble -f
      - tail -f /var/log/ideal-tribble-*.log