#cloud-config

# Basic server setup for ideal-tribble
package_update: true
package_upgrade: true

packages:
  - curl
  - wget
  - unzip
  - nginx
  - certbot
  - python3-certbot-nginx
  - ufw
  - htop
  - git

# Create application user
users:
  - name: ${APP_USER}
    system: true
    shell: /bin/bash
    home: ${APP_DIR}
    create_home: true

# Create directories
runcmd:
  # Install Docker via official method
  - curl -fsSL https://get.docker.com -o get-docker.sh
  - sh get-docker.sh
  - systemctl enable docker
  - systemctl start docker
  - usermod -aG docker ${APP_USER}

  # Setup firewall
  - ufw allow ssh
  - ufw allow 'Nginx Full' 
  - echo "y" | ufw enable
  
  # Create application directory
  - mkdir -p ${APP_DIR}
  - chown ${APP_USER}:${APP_USER} ${APP_DIR}
  
  # Note: nginx configuration is now managed by the deploy script
  
  # Setup deployment directory
  - mkdir -p /opt/deployment
  - echo "Server setup complete. Ready for application deployment."

write_files:
  - path: /opt/deployment/README.md
    content: |
      # Ideal Tribble Server Setup Complete
      
      Next steps:
      1. Upload your application binary to ${APP_DIR}/ideal-tribble
      2. Run: chmod +x ${APP_DIR}/ideal-tribble  
      3. Run: ./scripts/setup-secrets.sh
      4. Run: ./scripts/install-systemd-service.sh
      5. Run: ./scripts/setup-cron.sh
      6. Run: sudo systemctl start ideal-tribble
      
      SSL Certificate:
      - sudo certbot --nginx -d wally-api.utiger.dk
      
      Logs:
      - sudo journalctl -u ideal-tribble -f
      - tail -f /var/log/ideal-tribble-*.log